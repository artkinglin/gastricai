name: CI

on:
  push:
  pull_request:

jobs:
  pure-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest ruff mypy
      - name: Run pure tests
        run: python -m pytest
      - name: Check syntax
        run: python -m py_compile gastric_common.py dicom_to_png.py experiment_config.py ct_segmentation.py
      - name: Lint pure modules
        run: python -m ruff check gastric_common.py dicom_to_png.py experiment_config.py ct_segmentation.py tests
